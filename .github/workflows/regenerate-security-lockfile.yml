name: Regenerate patched npm lockfile

on:
  push:
    branches:
      - fix/prod-dependencies-audit-20261014

permissions:
  contents: write

jobs:
  fix-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Resolve patched dependency lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit --omit=dev --audit-level=moderate
      - name: Commit updated lockfile to this feature branch
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile was already up to date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "fix(lockfile): resolve patched transitive dependencies"
          git push
