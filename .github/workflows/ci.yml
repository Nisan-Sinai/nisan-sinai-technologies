name: Centrally managed database CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: database-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    uses: Nisan-Sinai/github-workflows/.github/workflows/postgres-contract.yml@4785c2f8c13f9b81fc3507069e94aa2f9c22d752 # main
    with:
      node-version: '24'
      verify-command: npm run test:migrations
