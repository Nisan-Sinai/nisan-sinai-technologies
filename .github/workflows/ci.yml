name: Centrally managed database CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: database-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    uses: Nisan-Sinai/github-workflows/.github/workflows/postgres-contract.yml@d51a5eff9e53db9ad1cf6dfc06e9d8e24e09bb03 # main
    with:
      node-version: '24'
      verify-command: npm run test:migrations
