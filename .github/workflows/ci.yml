name: Centrally managed database CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: database-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    uses: Nisan-Sinai/github-workflows/.github/workflows/postgres-contract.yml@c1c2dd6f344e7bb9626d4a57885bfd0d277cd0eb # main
    with:
      node-version: '24'
      verify-command: npm run test:migrations
