name: Refresh security lock

on:
  push:
    branches:
      - fix/seo-audit-2026-09-10
    paths:
      - .github/workflows/refresh-security-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/seo-audit-2026-09-10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile and remove helper
        shell: bash
        run: |
          rm .github/workflows/refresh-security-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/refresh-security-lock.yml
          git commit -m "chore(deps): refresh lockfile for security override"
          git push origin HEAD:fix/seo-audit-2026-09-10
