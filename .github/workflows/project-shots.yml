name: Project screenshots

# The portfolio shows the three live sites. Two of them refuse to be framed,
# which is correct for a site with a login, so a real browser photographs them
# on a schedule instead and commits the result.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    name: Photograph the live sites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run capture:projects

      - name: Commit the refreshed screenshots
        run: |
          if git diff --quiet -- public/projects; then
            echo "The sites look the same as last time; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/projects
          git commit -m "Refresh the project screenshots

          Captured from the live sites by the scheduled workflow."
          git push
