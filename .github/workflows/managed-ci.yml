name: Centrally managed CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read
  statuses: read

concurrency:
  group: managed-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    uses: Nisan-Sinai/github-workflows/.github/workflows/node-ci.yml@4785c2f8c13f9b81fc3507069e94aa2f9c22d752 # main
    with:
      node-version: '24'
      package-manager: npm
      install-command: npm ci
      lint-command: npm run scan:secrets && npm run lint
      typecheck-command: npm run type-check
      test-command: npm run test:audit-policy && npm run test:coverage
      build-command: npm run build:vercel && npm run build:sites && npm run test:rendered

  security:
    uses: Nisan-Sinai/github-workflows/.github/workflows/security-ci.yml@4785c2f8c13f9b81fc3507069e94aa2f9c22d752 # main
    with:
      ecosystem: node
      package-manager: npm
      audit-command: npm run audit:ci

  browser:
    uses: Nisan-Sinai/github-workflows/.github/workflows/browser-qa.yml@4785c2f8c13f9b81fc3507069e94aa2f9c22d752 # main
    with:
      node-version: '24'
      package-manager: npm
      install-command: npm ci
      browser-install-command: npx playwright install --with-deps chromium
      build-command: npm run build:vercel
      e2e-command: npm run test:e2e

  supabase-cloud:
    if: github.actor != 'dependabot[bot]'
    uses: Nisan-Sinai/github-workflows/.github/workflows/supabase-cloud-qa.yml@4785c2f8c13f9b81fc3507069e94aa2f9c22d752 # main
    with:
      project-ref: wgkzxhonjnjqxoofipmm
      node-version: '24'
      package-manager: npm
      install-command: npm ci
      verify-command: npm run check:data-api
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

  vercel:
    if: github.event_name == 'pull_request'
    uses: Nisan-Sinai/github-workflows/.github/workflows/vercel-gate.yml@4785c2f8c13f9b81fc3507069e94aa2f9c22d752 # main
    with:
      contexts-json: '["Vercel"]'
