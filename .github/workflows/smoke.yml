name: Centrally managed deployment smoke

# CI proves the code builds. This proves the deployment users actually reach is
# serving, and that the credentials it runs on are still accepted.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      site_url:
        description: Deployment to check (defaults to production)
        required: false
        type: string

permissions:
  contents: read

jobs:
  deployment:
    uses: Nisan-Sinai/github-workflows/.github/workflows/deployment-smoke.yml@c1c2dd6f344e7bb9626d4a57885bfd0d277cd0eb # main
    with:
      node-version: '24'
      deployment-url: ${{ inputs.site_url || vars.SITE_URL || 'https://nisan-sinai-technologies.vercel.app' }}
      verify-command: npm run smoke

  # Required target/key validation runs centrally before the repository script;
  # missing credentials can no longer silently skip the Data API check.
  data-api:
    needs: deployment
    uses: Nisan-Sinai/github-workflows/.github/workflows/supabase-cloud-qa.yml@c1c2dd6f344e7bb9626d4a57885bfd0d277cd0eb # main
    with:
      project-ref: wgkzxhonjnjqxoofipmm
      node-version: '24'
      package-manager: npm
      install-command: npm ci
      verify-command: npm run check:data-api
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
