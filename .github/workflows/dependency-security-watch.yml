name: Centrally managed dependency watch

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-watch
  cancel-in-progress: true

jobs:
  audit:
    uses: Nisan-Sinai/github-workflows/.github/workflows/dependency-watch.yml@4785c2f8c13f9b81fc3507069e94aa2f9c22d752 # main
    with:
      node-version: '24'
      package-manager: npm
      install-command: npm ci
      audit-command: npm run audit:ci
