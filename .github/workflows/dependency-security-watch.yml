name: Centrally managed dependency watch

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-watch
  cancel-in-progress: true

jobs:
  audit:
    uses: Nisan-Sinai/github-workflows/.github/workflows/dependency-watch.yml@c1c2dd6f344e7bb9626d4a57885bfd0d277cd0eb # main
    with:
      node-version: '24'
      package-manager: npm
      install-command: npm ci
      audit-command: npm run audit:ci
