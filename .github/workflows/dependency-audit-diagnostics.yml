name: Dependency audit diagnostics
on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-audit-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Audit original locked dependencies
        run: |
          npm audit --json --audit-level=low --package-lock-only --registry=https://registry.npmjs.org --include=optional --include=peer --include=dev > audit-before.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('audit-before.json', 'utf8'));
          console.log('AUDIT_BEFORE=' + JSON.stringify(Object.values(report.vulnerabilities || {}).map(v => ({
            name: v.name, severity: v.severity, range: v.range, isDirect: v.isDirect, fixAvailable: v.fixAvailable
          }))));
          NODE
      - name: Trial non-forced patch
        run: |
          npm install --package-lock-only --save-exact --ignore-scripts next@16.4.6 eslint-config-next@16.4.6 react-server-dom-webpack@19.3.1
          npm audit fix --package-lock-only --ignore-scripts || true
          npm audit --json --audit-level=low --package-lock-only --registry=https://registry.npmjs.org --include=optional --include=peer --include=dev > audit-after.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const before = JSON.parse(cp.execFileSync('git', ['show', 'HEAD:package-lock.json'], {encoding: 'utf8'}));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const patch = {root: Object.fromEntries(Object.entries(after).filter(([k]) => k !== 'packages')), updated: {}, removed: []};
          for (const [key, value] of Object.entries(after.packages)) {
            if (JSON.stringify(before.packages[key]) !== JSON.stringify(value)) patch.updated[key] = value;
          }
          for (const key of Object.keys(before.packages)) {
            if (!(key in after.packages)) patch.removed.push(key);
          }
          console.log('LOCK_DELTA=' + JSON.stringify(patch));
          console.log('MANIFEST_DIRECT=' + JSON.stringify({dependencies: manifest.dependencies, devDependencies: manifest.devDependencies, overrides: manifest.overrides}));
          const report = JSON.parse(fs.readFileSync('audit-after.json', 'utf8'));
          console.log('AUDIT_AFTER=' + JSON.stringify(Object.values(report.vulnerabilities || {}).map(v => ({
            name: v.name, severity: v.severity, range: v.range, isDirect: v.isDirect, fixAvailable: v.fixAvailable
          }))));
          NODE
